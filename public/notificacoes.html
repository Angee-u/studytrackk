
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studyTrack — Disparar notificação</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <h1>Disparar notificação — studyTrack</h1>
  <p class="sub">
    Ferramenta interna de teste. Envia notificações via Firebase
    para os aparelhos registrados dos usuários selecionados.
  </p>

  <div class="card">
    <div class="topo-lista">
      <label class="titulo-lista">Destinatários</label>
      <button type="button" class="link" id="btnRecarregar">
        Recarregar lista
      </button>
    </div>

    <div id="listaUsuarios" class="lista-usuarios">
      <div class="usuario-item mensagem-lista">
        Carregando usuários...
      </div>
    </div>

    <p class="ajuda">
      Somente usuários com aparelho registrado via
      <code>/api/dispositivos</code> recebem a notificação.
    </p>
  </div>

  <div class="card">
    <label for="titulo">Título</label>
    <input
      type="text"
      id="titulo"
      placeholder="Ex.: Prova amanhã"
      maxlength="100"
    >

    <label for="corpo">Mensagem</label>
    <textarea
      id="corpo"
      placeholder="Ex.: Sistemas Distribuídos às 19h"
    ></textarea>

    <button id="btnEnviar" type="button">
      Enviar notificação
    </button>

    <div id="status" class="status"></div>
  </div>
</main>

<script>
  const API = '';

  const elLista = document.getElementById('listaUsuarios');
  const elTitulo = document.getElementById('titulo');
  const elCorpo = document.getElementById('corpo');
  const elStatus = document.getElementById('status');
  const elBtnEnviar = document.getElementById('btnEnviar');
  const elBtnRecarregar = document.getElementById('btnRecarregar');

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s ?? '';
    return d.innerHTML;
  }

  async function carregarUsuarios() {
    elLista.innerHTML =
      '<div class="usuario-item mensagem-lista">Carregando usuários...</div>';

    try {
      const resp = await fetch(`${API}/api/usuarios`);
      const dados = await resp.json();

      if (!resp.ok) {
        throw new Error(dados.erro || 'Erro ao carregar usuários');
      }

      if (!dados.usuarios || dados.usuarios.length === 0) {
        elLista.innerHTML =
          '<div class="usuario-item mensagem-lista">Nenhum usuário cadastrado ainda.</div>';
        return;
      }

      elLista.innerHTML = '';

      for (const u of dados.usuarios) {
        const item = document.createElement('label');
        item.className = 'usuario-item';

        item.innerHTML = `
          <input type="checkbox" value="${u.id}" class="chk-usuario">
          <span>
            <div class="usuario-nome">${escapeHtml(u.nome)}</div>
            <div class="usuario-email">
              ${escapeHtml(u.email)} · id ${u.id}
            </div>
          </span>
        `;

        elLista.appendChild(item);
      }

    } catch (e) {
      elLista.innerHTML = `
        <div class="usuario-item mensagem-lista erro">
          Falha ao carregar: ${escapeHtml(e.message)}
        </div>
      `;
    }
  }

  function usuariosSelecionados() {
    return Array.from(
      document.querySelectorAll('.chk-usuario:checked')
    ).map(el => parseInt(el.value, 10));
  }

  async function enviar() {
    const ids = usuariosSelecionados();
    const titulo = elTitulo.value.trim();
    const corpo = elCorpo.value.trim();

    elStatus.className = 'status';
    elStatus.textContent = '';

    if (ids.length === 0) {
      elStatus.className = 'status erro';
      elStatus.textContent = 'Selecione ao menos um usuário.';
      return;
    }

    if (!titulo || !corpo) {
      elStatus.className = 'status erro';
      elStatus.textContent = 'Preencha título e mensagem.';
      return;
    }

    elBtnEnviar.disabled = true;
    elBtnEnviar.textContent = 'Enviando...';

    const resultados = [];

    for (const usuario_id of ids) {
      try {
        const resp = await fetch(`${API}/api/notificacoes/enviar`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            usuario_id,
            titulo,
            corpo
          })
        });

        const dados = await resp.json();

        if (resp.ok) {
          resultados.push(
            `usuário ${usuario_id}: ${dados.enviadas} enviada(s)` +
            (dados.falhas?.length
              ? `, falhas: ${dados.falhas.join('; ')}`
              : '')
          );
        } else {
          resultados.push(
            `usuário ${usuario_id}: erro — ${dados.erro}`
          );
        }

      } catch (e) {
        resultados.push(
          `usuário ${usuario_id}: falha de conexão — ${e.message}`
        );
      }
    }

    elBtnEnviar.disabled = false;
    elBtnEnviar.textContent = 'Enviar notificação';

    const algumaFalha = resultados.some(
      r => r.includes('erro') || r.includes('falha')
    );

    elStatus.className =
      'status ' + (algumaFalha ? 'erro' : 'ok');

    elStatus.textContent = resultados.join('\n');
  }

  elBtnEnviar.addEventListener('click', enviar);
  elBtnRecarregar.addEventListener('click', carregarUsuarios);

  carregarUsuarios();
</script>
</body>
</html>
