<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studyTrack — Disparar notificação</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<main>
  <h1>Disparar notificação — studyTrack</h1>
  <p class="sub">
    Ferramenta interna de teste. Envia notificações via Firebase
    para os aparelhos registrados na sua conta.
  </p>

  <div class="card" id="areaLogin">
    <h2 class="titulo-card">Acessar conta</h2>
    <form id="formLogin">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        placeholder="Seu e-mail cadastrado"
        required
      >

      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        autocomplete="current-password"
        required
      >

      <button type="submit" id="btnEntrar">Entrar</button>
    </form>
  </div>

  <div id="areaAutenticada" hidden>
    <div class="card">
      <div class="topo-lista">
        <label class="titulo-lista">Destinatário</label>
        <button type="button" class="link" id="btnRecarregar">
          Recarregar lista
        </button>
      </div>

      <div id="listaUsuarios" class="lista-usuarios">
        <div class="usuario-item mensagem-lista">
          Carregando usuário...
        </div>
      </div>

      <p class="ajuda">
        Somente aparelhos vinculados à sua conta por
        <code>/api/dispositivos</code> recebem a notificação.
      </p>

      <button id="btnSair" class="btn-sair" type="button">Sair da conta</button>
    </div>

    <div class="card">
      <form id="formNotificacao">
        <label for="titulo">Título</label>
        <input
          type="text"
          id="titulo"
          placeholder="Ex.: Prova amanhã"
          maxlength="100"
          required
        >

        <label for="corpo">Mensagem</label>
        <textarea
          id="corpo"
          placeholder="Ex.: Sistemas Distribuídos às 19h"
          required
        ></textarea>

        <button id="btnEnviar" type="submit">Enviar notificação</button>
      </form>
    </div>
  </div>

  <div id="status" class="status" role="status" aria-live="polite"></div>
</main>

<script>
  const API = '';
  let token = null;
  let usuario = null;

  const elLogin = document.getElementById('areaLogin');
  const elAreaAutenticada = document.getElementById('areaAutenticada');
  const elLista = document.getElementById('listaUsuarios');
  const elTitulo = document.getElementById('titulo');
  const elCorpo = document.getElementById('corpo');
  const elStatus = document.getElementById('status');
  const elBtnEntrar = document.getElementById('btnEntrar');
  const elBtnEnviar = document.getElementById('btnEnviar');
  const elBtnSair = document.getElementById('btnSair');
  const elBtnRecarregar = document.getElementById('btnRecarregar');
  const elFormLogin = document.getElementById('formLogin');
  const elFormNotificacao = document.getElementById('formNotificacao');

  function mostrarStatus(mensagem, tipo = '') {
    elStatus.className = tipo ? `status ${tipo}` : 'status';
    elStatus.textContent = mensagem;
  }

  function atualizarTela() {
    const autenticado = Boolean(token && usuario);
    elLogin.hidden = autenticado;
    elAreaAutenticada.hidden = !autenticado;
  }

  function encerrarSessaoLocal() {
    token = null;
    usuario = null;
    elLista.replaceChildren();
    elFormNotificacao.reset();
    atualizarTela();
  }

  async function chamarApi(caminho, opcoes = {}) {
    const headers = {};
    if (token) headers.Authorization = `Bearer ${token}`;
    if (opcoes.corpo !== undefined) headers['Content-Type'] = 'application/json';

    const resposta = await fetch(`${API}${caminho}`, {
      method: opcoes.metodo || 'GET',
      headers,
      body: opcoes.corpo !== undefined ? JSON.stringify(opcoes.corpo) : undefined
    });

    const dados = await resposta.json().catch(() => ({}));
    if (!resposta.ok) {
      if (resposta.status === 401 && token) {
        encerrarSessaoLocal();
        throw new Error('Sua sessão expirou. Entre novamente.');
      }
      throw new Error(dados.erro || `Erro HTTP ${resposta.status}`);
    }
    return dados;
  }

  async function carregarUsuarios() {
    if (!token) return;
    elLista.textContent = 'Carregando usuário...';
    elBtnRecarregar.disabled = true;

    try {
      // A API JWT só permite consultar a conta que está conectada.
      const dados = await chamarApi('/api/auth/me');
      usuario = dados.usuario;
      if (!usuario) throw new Error('Não foi possível identificar a conta.');

      elLista.replaceChildren();
      const item = document.createElement('label');
      item.className = 'usuario-item';

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'chk-usuario';
      checkbox.value = String(usuario.id);
      checkbox.checked = true;

      const detalhes = document.createElement('span');
      const nome = document.createElement('span');
      nome.className = 'usuario-nome';
      nome.textContent = usuario.nome;

      const email = document.createElement('span');
      email.className = 'usuario-email';
      email.textContent = `${usuario.email} · id ${usuario.id}`;

      detalhes.append(nome, email);
      item.append(checkbox, detalhes);
      elLista.appendChild(item);
    } catch (erro) {
      if (token) {
        elLista.textContent = `Falha ao carregar: ${erro.message}`;
        mostrarStatus(erro.message, 'erro');
      } else {
        mostrarStatus(erro.message, 'erro');
      }
    } finally {
      elBtnRecarregar.disabled = false;
    }
  }

  elFormLogin.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    mostrarStatus('');
    elBtnEntrar.disabled = true;
    elBtnEntrar.textContent = 'Entrando...';

    try {
      const dados = await chamarApi('/api/auth/login', {
        metodo: 'POST',
        corpo: {
          email: document.getElementById('email').value.trim(),
          senha: document.getElementById('senha').value
        }
      });

      token = dados.token;
      usuario = dados.usuario;
      document.getElementById('senha').value = '';
      atualizarTela();
      mostrarStatus('Login realizado.', 'ok');
      await carregarUsuarios();
    } catch (erro) {
      mostrarStatus(erro.message, 'erro');
    } finally {
      elBtnEntrar.disabled = false;
      elBtnEntrar.textContent = 'Entrar';
    }
  });

  elFormNotificacao.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    mostrarStatus('');

    const selecionado = document.querySelector('.chk-usuario:checked');
    if (!selecionado) {
      mostrarStatus('Selecione o destinatário.', 'erro');
      return;
    }

    const titulo = elTitulo.value.trim();
    const corpo = elCorpo.value.trim();
    if (!titulo || !corpo) {
      mostrarStatus('Preencha título e mensagem.', 'erro');
      return;
    }

    elBtnEnviar.disabled = true;
    elBtnEnviar.textContent = 'Enviando...';

    try {
      // O servidor decide o destinatário pelo JWT, não pelo ID do checkbox.
      const dados = await chamarApi('/api/notificacoes/enviar', {
        metodo: 'POST',
        corpo: { titulo, corpo }
      });
      const falhas = dados.falhas?.length ? ` Falhas: ${dados.falhas.join('; ')}` : '';
      mostrarStatus(`${dados.enviadas} notificação(ões) enviada(s).${falhas}`, falhas ? 'erro' : 'ok');
    } catch (erro) {
      mostrarStatus(erro.message, 'erro');
    } finally {
      elBtnEnviar.disabled = false;
      elBtnEnviar.textContent = 'Enviar notificação';
    }
  });

  elBtnSair.addEventListener('click', async () => {
    elBtnSair.disabled = true;
    try {
      await chamarApi('/api/auth/logout', { metodo: 'POST' });
      encerrarSessaoLocal();
      mostrarStatus('Sessão encerrada.', 'ok');
    } catch (erro) {
      mostrarStatus(erro.message, 'erro');
    } finally {
      elBtnSair.disabled = false;
    }
  });

  elBtnRecarregar.addEventListener('click', carregarUsuarios);
  atualizarTela();
</script>
</body>
</html>
